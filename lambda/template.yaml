AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI-Pokupki Lambda with API key + JWT

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x

Resources:
  PokupkiFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: .
      Architectures: [arm64]
      Environment:
        Variables:
          API_KEY: ''
          JWT_SECRET: ''
          ADMIN_EMAIL: admin
          ADMIN_PASSWORD: ''
          WAREHOUSE_PROVIDER: dummyjson
          WAREHOUSE_API_URL: ''
          PLATFORM_API_URL: ''
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: [GET, POST]
          AllowHeaders: ['authorization', 'content-type', 'x-api-key']
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
