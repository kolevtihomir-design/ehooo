services:
  - type: web
    name: ai-pokupki
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: EASYSHIP_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ── Autonomous agents (OpenRouter, dry-run) ──
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: AGENTS_ENABLED
        value: "0"
